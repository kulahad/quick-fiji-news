name: "Refresh static news JSON"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-news-json
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static news JSON
        run: pnpm build:json

      - name: Commit refreshed snapshot (if any)
        run: |
          if git diff --quiet -- public/news/latest.json; then
            echo "No headline changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/news/latest.json
          git commit -m "chore(news): refresh static headlines [skip ci]"
          git push
